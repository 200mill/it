services:
  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    env_file:
      - .env
    environment:
      BIND_ADDR: 0.0.0.0:80
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      target: bot
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:80
    depends_on:
      - backend
    restart: unless-stopped

  # Optional author display-name cache. Start with: podman compose --profile cache up
  redis:
    image: redis:7
    profiles: ["cache"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
